input {
  tcp {
    port => 50000
    codec => json_lines
  }
}

filter {
  if [logger_name] =~ "website.ylab.learningplatform" {
    mutate {
      add_field => { "[@metadata][type]" => "application" }
    }
  }
}

output {
  stdout { codec => rubydebug }
  file {
    path => "./logs/logstash.log"
    codec => line { format => "%{message}"}
  }
}
