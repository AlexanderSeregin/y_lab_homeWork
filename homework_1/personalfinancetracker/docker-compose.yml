version: "3.9"

services:
  gradle-console-app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - pft
    restart: unless-stopped

  postgres:
    image: postgres:13.4
    container_name: finance_tracker_postgres
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
    ports:
      - "5432:5432"
    networks:
      - pft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finance_user -d finance_tracker" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pft:
    name: elk
    external: true

volumes:
  postgres_data: