version: "3.9"

services:
  gradle-console-app:
    build: .
    ports:
      - "8186:8186"
    # Дополнительно можно указать restart-политику
    # restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    container_name: finance_tracker_postgres
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
    ports:
      - "5234:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: